name: WEEX Scanner

on:
  schedule:
    - cron: '3,33 * * * *'
    - cron: '13,23,43,53 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scanner.yml'
      - 'scripts/**'
      - 'config/**'

permissions:
  contents: write

concurrency:
  group: weex-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce 08:00-22:00 Europe/Warsaw window
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          MINUTE=$(TZ=Europe/Warsaw date +%M)
          NOW=$((10#$HOUR * 60 + 10#$MINUTE))
          START=$((8 * 60))
          END=$((22 * 60))
          if (( NOW < START || NOW > END )); then
            echo "Outside scanner window 08:00-22:00 Europe/Warsaw; stopping successfully."
            echo "RUN_SCANNER=false" >> "$GITHUB_ENV"
          else
            echo "RUN_SCANNER=true" >> "$GITHUB_ENV"
          fi
      - name: Enable non-scheduled runs
        if: github.event_name != 'schedule'
        run: echo "RUN_SCANNER=true" >> "$GITHUB_ENV"
      - name: Select scan mode
        if: env.RUN_SCANNER == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" == "3,33 * * * *" ]]; then
            echo "SCANNER_RUN_MODE=full" >> "$GITHUB_ENV"
          else
            echo "SCANNER_RUN_MODE=monitor" >> "$GITHUB_ENV"
          fi
      - name: Run production scanner
        if: env.RUN_SCANNER == 'true'
        run: python scripts/actions_runner.py
      - name: Persist WATCH state
        if: env.RUN_SCANNER == 'true'
        shell: bash
        run: |
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'
          git add history/scanner_v2_state.json history/turn_monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist scanner WATCH state [skip ci]'
            git push origin HEAD:main
          fi
