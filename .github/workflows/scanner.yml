name: WEEX Scanner Validation
on:
  push:
    branches: [migration-v116-work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: "false"
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/actions_runner.py
