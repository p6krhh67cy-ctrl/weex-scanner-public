name: WEEX Scanner

on:
  schedule:
    - cron: '3,33 * * * *'
    - cron: '13,23,43,53 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scanner.yml'
      - 'scripts/**'
      - 'config/**'

permissions:
  contents: write

concurrency:
  group: weex-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select scan mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" == "3,33 * * * *" ]]; then
            echo "SCANNER_RUN_MODE=full" >> "$GITHUB_ENV"
          else
            echo "SCANNER_RUN_MODE=monitor" >> "$GITHUB_ENV"
          fi
      - name: Run production scanner
        run: python scripts/actions_runner.py
      - name: Persist WATCH state
        shell: bash
        run: |
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'
          git add history/scanner_v2_state.json history/turn_monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist scanner WATCH state [skip ci]'
            git push origin HEAD:main
          fi
