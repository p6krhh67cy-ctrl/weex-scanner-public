name: WEEX Scanner Schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full or monitor; blank = auto from Warsaw time'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke.yml'
  schedule:
    - cron: '*/10 7-21 * * *'

permissions:
  contents: write

concurrency:
  group: weex-scanner-cycle
  cancel-in-progress: false

jobs:
  scanner-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      SCANNER_OWNER_GENERATION: '20261026-v7'
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Warsaw slot and run scanner
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'
          MODE="${REQUESTED_MODE:-}"
          HOUR=$(TZ=Europe/Warsaw date +%H)
          MINUTE=$(TZ=Europe/Warsaw date +%M)
          H=$((10#$HOUR)); M=$((10#$MINUTE)); NOW=$((H*60+M))
          SLOT=$(( ((M + 4) / 10) * 10 ))
          if (( SLOT >= 60 )); then SLOT=0; fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            MODE=full
          elif [[ "$MODE" != "full" && "$MODE" != "monitor" ]]; then
            if (( NOW >= 480 && NOW <= 1324 && (SLOT == 0 || SLOT == 30) )); then
              MODE=full
            elif (( NOW >= 480 && NOW < 1380 )); then
              MODE=monitor
            else
              echo "Outside scanner hours"
              exit 0
            fi
          fi
          export SCANNER_RUN_MODE="$MODE"
          echo "Warsaw $(TZ=Europe/Warsaw date '+%F %T %Z') event=$EVENT_NAME slot=$SLOT mode=$MODE"
          python scripts/actions_runner.py
          git add history/scanner_v2_state.json history/turn_monitor_state.json history/scanner_cycles.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Archive scanner $MODE $(TZ=Europe/Warsaw date '+%F %H:%M') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
