name: WEEX Scanner Watchdog
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weex-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select local time and mode
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          MINUTE=$(TZ=Europe/Warsaw date +%M)
          NOW=$((10#$HOUR * 60 + 10#$MINUTE))
          if (( NOW < 480 || NOW > 1320 )); then
            echo "RUN_SCANNER=false" >> "$GITHUB_ENV"
          else
            echo "RUN_SCANNER=true" >> "$GITHUB_ENV"
            if (( 10#$MINUTE < 10 || (10#$MINUTE >= 30 && 10#$MINUTE < 40) )); then
              echo "SCANNER_RUN_MODE=full" >> "$GITHUB_ENV"
            else
              echo "SCANNER_RUN_MODE=monitor" >> "$GITHUB_ENV"
            fi
          fi
      - name: Run scanner
        if: env.RUN_SCANNER == 'true'
        run: python scripts/actions_runner.py
      - name: Persist WATCH state
        if: env.RUN_SCANNER == 'true'
        shell: bash
        run: |
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'
          git add history/scanner_v2_state.json history/turn_monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist scanner state'
            git push origin HEAD:main
          fi
