name: WEEX Scanner Schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full or monitor; blank = auto from Warsaw time'
        required: false
        default: ''
  schedule:
    - cron: '*/10 7-21 * * *'

permissions:
  contents: write

concurrency:
  group: weex-scanner-cycle
  cancel-in-progress: false

jobs:
  scanner-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      SCANNER_OWNER_GENERATION: '20261026-v5'
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Warsaw slot and run one scanner cycle
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'

          HOUR=$(TZ=Europe/Warsaw date +%H)
          MINUTE=$(TZ=Europe/Warsaw date +%M)
          H=$((10#$HOUR)); M=$((10#$MINUTE)); NOW=$((H * 60 + M))
          MODE="${REQUESTED_MODE:-}"

          if [[ "$MODE" != "full" && "$MODE" != "monitor" ]]; then
            if (( NOW >= 480 && NOW <= 1320 && (M == 0 || M == 30) )); then
              MODE=full
            elif (( NOW >= 480 && NOW < 1380 )); then
              MODE=monitor
            else
              echo "Outside 08:00-23:00 Europe/Warsaw; no scanner cycle"
              exit 0
            fi
          fi

          # A scheduled run may start a few minutes late; classify by the intended
          # 10-minute Warsaw slot rather than requiring second-level precision.
          export SCANNER_RUN_MODE="$MODE"
          echo "Warsaw $(TZ=Europe/Warsaw date '+%F %T %Z') mode=$SCANNER_RUN_MODE"
          python scripts/actions_runner.py

          git add history/scanner_v2_state.json history/turn_monitor_state.json history/scanner_cycles.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Archive scanner slot $(TZ=Europe/Warsaw date '+%F %H:%M') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
