name: WEEX Scanner Schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full or monitor; blank = auto from Warsaw time'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke.yml'
  schedule:
    # GitHub cron is UTC. On 26 Oct 2026 Warsaw is CET (UTC+1).
    # FULL: 08:00, 08:30 ... 22:00 Warsaw.
    - cron: '0,30 7-20 * * *'
    - cron: '0 21 * * *'
    # WATCH monitor: 08:10/20, 08:40/50 ... 21:40/50, then 22:10..22:50 Warsaw.
    - cron: '10,20,40,50 7-20 * * *'
    - cron: '10,20,30,40,50 21 * * *'

permissions:
  contents: write

concurrency:
  group: weex-scanner-cycle
  cancel-in-progress: false

jobs:
  scanner-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      SCANNER_OWNER_GENERATION: '20261026-v7'
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve scheduled role and run one scanner cycle
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'

          MODE="${REQUESTED_MODE:-}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            MODE=full
          elif [[ "$MODE" != "full" && "$MODE" != "monitor" ]]; then
            case "$SCHEDULE_EXPR" in
              '0,30 7-20 * * *'|'0 21 * * *') MODE=full ;;
              '10,20,40,50 7-20 * * *'|'10,20,30,40,50 21 * * *') MODE=monitor ;;
              *) echo "Unknown schedule: $SCHEDULE_EXPR"; exit 1 ;;
            esac
          fi

          export SCANNER_RUN_MODE="$MODE"
          echo "Warsaw $(TZ=Europe/Warsaw date '+%F %T %Z') event=$EVENT_NAME schedule='$SCHEDULE_EXPR' mode=$SCANNER_RUN_MODE"
          python scripts/actions_runner.py

          git add history/scanner_v2_state.json history/turn_monitor_state.json history/scanner_cycles.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Archive scanner cycle $(TZ=Europe/Warsaw date '+%F %H:%M') [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi
