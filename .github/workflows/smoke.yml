name: WEEX Scanner Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke.yml'

permissions:
  contents: write
  actions: write

jobs:
  scanner-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ALERTS_ENABLED: 'true'
      SCANNER_STATE_PATH: ./history/scanner_v2_state.json
      TURN_MONITOR_STATE_PATH: ./history/turn_monitor_state.json
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run continuous scanner cycles
        shell: bash
        run: |
          set +e
          git config user.name 'weex-scanner-bot'
          git config user.email 'scanner@users.noreply.github.com'

          LAST_SLOT=''
          END_EPOCH=$(( $(date +%s) + 20400 ))

          while (( $(date +%s) < END_EPOCH )); do
            HOUR=$(TZ=Europe/Warsaw date +%H)
            MINUTE=$(TZ=Europe/Warsaw date +%M)
            SECOND=$(TZ=Europe/Warsaw date +%S)
            H=$((10#$HOUR)); M=$((10#$MINUTE)); S=$((10#$SECOND))
            NOW=$((H * 60 + M))

            # The active slot is the most recent 10-minute boundary.
            # If the watchdog starts late (e.g. 11:34), execute the missed 11:30
            # slot immediately instead of waiting until 11:40.
            SLOT_MIN=$(( (M / 10) * 10 ))
            SLOT=$(printf '%02d:%02d' "$H" "$SLOT_MIN")

            if (( NOW >= 480 && NOW < 1320 )) && [[ "$SLOT" != "$LAST_SLOT" ]]; then
              LAST_SLOT="$SLOT"
              echo "Executing Warsaw slot $SLOT at $(TZ=Europe/Warsaw date '+%F %T %Z')"

              if (( SLOT_MIN == 0 || SLOT_MIN == 30 )); then
                export SCANNER_RUN_MODE=full
              else
                export SCANNER_RUN_MODE=monitor
              fi

              echo "Mode: $SCANNER_RUN_MODE"
              python scripts/actions_runner.py || echo "Scanner cycle failed; continuing watchdog"

              git add history/scanner_v2_state.json history/turn_monitor_state.json
              if ! git diff --cached --quiet; then
                git commit -m 'Persist scanner state [skip ci]'
                git pull --rebase origin main || true
                git push origin HEAD:main || true
              fi
            fi

            # Sleep only until the next exact 10-minute boundary, then wake up.
            MINUTE=$(TZ=Europe/Warsaw date +%M)
            SECOND=$(TZ=Europe/Warsaw date +%S)
            M=$((10#$MINUTE)); S=$((10#$SECOND))
            REM=$((M % 10))
            WAIT=$(((10 - REM) * 60 - S))
            if (( WAIT <= 0 || WAIT > 600 )); then WAIT=1; fi
            echo "Next slot in ${WAIT}s"
            sleep "$WAIT"
          done
      - name: Hand off to next watchdog run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/smoke.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "SUCCESSOR_QUEUED"
